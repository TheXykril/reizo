name: CI

# Runs only for pull requests, pushes to main and manual runs. Pushes to other branches do not
# trigger it, there is no schedule, and documentation-only changes are skipped to save minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 compiles core and the 1.21.x builds; 25 (listed last, so the default) runs Gradle
          # and compiles 26.x.
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every Minecraft version (compile, format check, unit tests, jars)
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: fabric/versions/*/build/libs/*.jar
          retention-days: 7

  gametest:
    name: In-game tests, ${{ matrix.minecraft }} (headless client)
    # Pinned to the image the tests pass on. On ubuntu-26.04 (Mesa 26.0) software rendering was so
    # slow that the test world never finished loading (run 45052144334 and the next three).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the newest version of each family; main tests every version (ADR 0007).
        minecraft: ${{ fromJSON(github.event_name == 'pull_request' && '["1.21.11", "26.3"]' || '["1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]') }}
    env:
      RUN_DIR: fabric/versions/${{ matrix.minecraft }}/build/run/clientGameTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and Mesa
        run: |
          # 26.x can't find a GLX visual under Xvfb, so it runs on Vulkan (Mesa's lavapipe) instead.
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils ffmpeg \
            mesa-vulkan-drivers libvulkan1
          xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|version)|Accelerated" || true
      - name: Run client gametests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Software rendering would otherwise take every core and starve the integrated server.
          LP_NUM_THREADS: "2"
          XDG_RUNTIME_DIR: /tmp/xdg
        run: |
          # Thread dumps of the game every 60 s, so a hang can be diagnosed. On CI, Loom itself wraps
          # the game in xvfb-run, so match the java process, not the shell wrapper.
          mkdir -p "$RUN_DIR/logs" && mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          ( while sleep 60; do
              for pid in $(pgrep -f '^/[^ ]*/bin/java .*devlaunchinjector'); do
                { date; jcmd "$pid" Thread.print; } >> "$RUN_DIR/logs/threads.txt" 2>&1
              done
            done ) &
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew ":fabric:${{ matrix.minecraft }}:runClientGameTest" --stacktrace
      - name: Print game thread dumps
        if: failure()
        run: |
          f="$RUN_DIR/logs/threads.txt"
          if [ -f "$f" ]; then
            # Last dump only: the threads that matter for a hang.
            awk '/^[A-Z][a-z][a-z] [A-Z][a-z][a-z] /{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' "$f"
          fi
      - name: Upload gametest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.minecraft }}
          path: ${{ env.RUN_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 7
